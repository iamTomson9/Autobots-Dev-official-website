<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Gradients matching brand sign -->
    <linearGradient id="leftTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    
    <linearGradient id="leftBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="rightTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="rightBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Left Angled Chevron (<) Facets -->
  <path d="M 75 25 L 45 55 L 60 70 L 90 40 Z" fill="url(#leftTopGrad)" />
  <path d="M 45 55 L 75 85 L 90 70 L 60 70 Z" fill="url(#leftBottomGrad)" />

  <!-- Right Angled Chevron (>) Facets -->
  <path d="M 85 55 L 115 85 L 100 100 L 70 70 Z" fill="url(#rightTopGrad)" />
  <path d="M 115 85 L 85 115 L 70 100 L 100 100 Z" fill="url(#rightBottomGrad)" />

  <!-- Pixel Grid Dots (Top Right of Right Chevron) -->
  <rect x="102" y="34" width="14" height="14" rx="3.5" fill="url(#mintGrad)" />
  <rect x="120" y="34" width="14" height="14" rx="3.5" fill="url(#skyGrad)" />
  <rect x="120" y="52" width="14" height="14" rx="3.5" fill="url(#purpleGrad)" />

  <!-- Brand Typography -->
  <text x="160" y="74" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" fill="currentColor" letter-spacing="-0.5">Autobots <tspan fill="#3B82F6">dev</tspan></text>
  <text x="162" y="102" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="3.5">Create.Innovate.Automate</text>
</svg>
